<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie - Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 18+ Abfrage -->
    <div id="age-gate" class="modal-overlay">
        <div class="modal-content">
            <h2>Altersbestätigung (18+)</h2>
            <p>Diese Galerie enthält Inhalte für Erwachsene. Bist du mindestens 18 Jahre alt?</p>
            <div class="modal-buttons">
                <button onclick="confirmAge(true)">Ja, ich bin 18+</button>
                <button onclick="confirmAge(false)">Nein, Verlassen</button>
            </div>
        </div>
    </div>

    <!-- Hauptinhalt im DeviantArt-Stil -->
    <div id="main-content" class="hidden">
        
        <!-- Banner & Profilbereich -->
        <div class="profile-header">
            <div class="banner-img" id="banner"></div>
            <div class="profile-info">
                <img src="bilder/SMkoopi-Seite/avatar.jpg" alt="Profilbild" class="avatar-img" onerror="this.src='https://via.placeholder.com/100/333/fff?text=Avatar'">
                <div class="profile-text">
                    <h2>Mein Portfolio</h2>
                    <p>Galerie & Original Characters</p>
                </div>
            </div>
        </div>

        <div class="container">
            <!-- Sektion 1: Galerie Ordner -->
            <section class="gallery-section">
                <h3 class="section-title">Gallery Folders</h3>
                <div class="folder-grid">
                    <div class="folder-card" onclick="selectFolder('chara-all')">
                        <div class="folder-cover" style="background-image: url('bilder/SMkoopi-Seite/amber/bild1.jpg');"></div>
                        <div class="folder-title">All Characters</div>
                    </div>
                    <div class="folder-card" onclick="selectFolder('amber')">
                        <div class="folder-cover" style="background-image: url('bilder/SMkoopi-Seite/amber/bild1.jpg');"></div>
                        <div class="folder-title">Amber</div>
                    </div>
                    <div class="folder-card" onclick="selectFolder('violet')">
                        <div class="folder-cover" style="background-image: url('bilder/SMkoopi-Seite/violet/bild1.jpg');"></div>
                        <div class="folder-title">Violet</div>
                    </div>
                    <div class="folder-card" onclick="selectFolder('vanessa')">
                        <div class="folder-cover" style="background-image: url('bilder/SMkoopi-Seite/vanessa/bild1.jpg');"></div>
                        <div class="folder-title">Vanessa</div>
                    </div>
                    <div class="folder-card" onclick="selectFolder('lena')">
                        <div class="folder-cover" style="background-image: url('bilder/SMkoopi-Seite/lena/bild1.jpg');"></div>
                        <div class="folder-title">Lena</div>
                    </div>
                    <div class="folder-card" onclick="selectFolder('drawings')">
                        <div class="folder-cover" style="background-image: url('bilder/SMkoopi-Seite/drawings/skizze1.jpg');"></div>
                        <div class="folder-title">Drawings</div>
                    </div>
                </div>
            </section>

            <hr class="divider">

            <!-- Sektion 2: Bilderraster -->
            <section class="gallery-section">
                <div class="gallery-header-flex">
                    <h3 class="section-title" id="current-folder-name">All Deviants / Werke</h3>
                    <button class="show-all-btn" onclick="selectFolder('all')">Alle anzeigen</button>
                </div>
                <div class="gallery-grid" id="gallery"></div>
            </section>
        </div>

        <!-- Lightbox Großansicht -->
        <div id="lightbox" class="lightbox" onclick="closeLightbox()">
            <img id="lightbox-img" src="" alt="Großansicht">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
